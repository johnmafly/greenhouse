# Greenhouse package manifest (contract v2, docs/package-contract.md in johnmafly/greenhouse).
# Set slug to the project's slug from portfolio/<slug>/intake.yaml.
slug: example-seed
build:
  command: npm run build
  output: dist
production_branch: main
# Where each required piece of content lives: a site path, optionally with #anchor. All seven keys
# are required; pages may share a path (use anchors). greenhouse check starts its crawl from / plus
# these paths, and each must return 200 with its anchor present. The paths below are only this
# unstyled example's; design your own information architecture and point these keys at it.
content:
  how_it_works: /docs/how-it-works/
  getting_started: /docs/getting-started/
  architecture: /docs/architecture/
  integration: /docs/integration/
  comparison: /docs/comparison/
  pricing: /pricing/
  signup: /signup/
# What each pricing tier costs and what it costs to serve one customer on it (assisted pricing gate:
# every tier's name and price must be on the pricing content, no paid tier below its cost to
# serve, and the self-hosting path shown when self_host is true). A free tier that costs you
# something to serve needs below_cost: true and a below_cost_reason. The full format, with
# overages, cost lines, self_hosting, sources and assumptions, is in docs/package-contract.md in
# johnmafly/greenhouse. Example numbers only.
cost_model:
  currency: USD
  period: month
  self_host: true
  tiers:
    - name: Free
      price: 0
      cost_to_serve: 0
      includes: Self-hosted open-source edition, community support.
    - name: Hosted
      price: 20
      cost_to_serve: 6
      includes: Hosted by us, with email support.
# Where each section of the user guide lives (docs gate, decision 0006): a site path with an
# optional #anchor, or a list of them. All thirteen keys are required. Each page also needs a
# Markdown version (/docs/<page>.md here), and /llms.txt and /llms-full.txt must list every page;
# scripts/build.mjs generates all three from the HTML pages. Point these keys at your own guide.
docs:
  overview: /docs/how-it-works/
  architecture: /docs/architecture/
  features: /docs/features/
  quickstart: /docs/getting-started/
  configuration: /docs/configuration/
  integrations: /docs/integration/
  api_reference: /docs/api/
  sdk_reference: /docs/sdk/
  domain_reference: /docs/projects/
  self_hosting: /docs/self-hosting/
  security: /docs/security/
  faq: /docs/faq/
  changelog: /docs/changelog/
