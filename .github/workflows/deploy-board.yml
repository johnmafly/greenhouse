# Deploys the board to Cloudflare Pages project greenhouse-board (direct upload).
# Fallback while the Cloudflare Pages GitHub app is not connected to johnmafly
# (docs/decisions/0001). Runs only on push to main, never on pull_request, so
# pull requests (including forks) never get CLOUDFLARE_API_TOKEN.
# The token is account-owned with only "Pages Write" on this account.
name: deploy-board
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-board
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: board
      url: https://greenhouse.agenthatch.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run board:build
      - name: Deploy board/dist to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.164.0 pages deploy board/dist
          --project-name greenhouse-board
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "deploy-board run $GITHUB_RUN_ID"
          --commit-dirty=false
